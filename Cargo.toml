[package]
name = "cardumen"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26"
arboard = "3"
bytemuck = "1"
cosmic-text = "0.19"
libc = "0.2"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swash = "0.2"
toml = "1"
wgpu = "30"
winit = "0.30"

[profile.release]
# Line numbers in panic backtraces (see log_panics in main.rs).
debug = "line-tables-only"
